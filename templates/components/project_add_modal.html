<div
    class="modal"
    id="add-project-modal"
>
    <div class="modal-content">

        <h2>Tambah Project</h2>

        <p>
            Tambahkan project baru ke portofolio.
        </p>

        <form id="add-project-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="project-title">
                    Nama Proyek
                </label>

                <input
                    type="text"
                    id="project-title"
                    name="title"
                    placeholder="Nama proyek"
                    maxlength="255"
                    required
                >
            </div>

            <div class="form-group">
                <label for="project-description">
                    Deskripsi Proyek
                </label>

                <textarea
                    id="project-description"
                    name="description"
                    placeholder="Ceritakan proyekmu"
                    rows="3"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="project-technology">
                    Teknologi yang Digunakan
                </label>

                <input
                    type="text"
                    id="project-technology"
                    name="technology"
                    placeholder="Django, Python, HTML, CSS"
                    required
                >
            </div>

            <div class="form-group">
                <label for="project-url">
                    URL Proyek
                </label>

                <input
                    type="url"
                    id="project-url"
                    name="project_url"
                    placeholder="https://example.com"
                >
            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    onclick="closeAddProjectModal()"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="edit-button"
                >
                    Simpan Project
                </button>

            </div>

        </form>

    </div>
</div>
